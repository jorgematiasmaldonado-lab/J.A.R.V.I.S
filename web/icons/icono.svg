<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- J.A.R.V.I.S. · Ícono del reactor · Autor: Maldonado Jorge Matias -->
  <defs>
    <radialGradient id="fondo" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#0b2a3d"/><stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="nucleo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ecfeff"/><stop offset=".3" stop-color="#a5f3fc"/>
      <stop offset=".6" stop-color="#22d3ee"/><stop offset="1" stop-color="#0891b2" stop-opacity=".15"/>
    </radialGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#fondo)"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#22d3ee" stroke-opacity=".45" stroke-width="8" stroke-dasharray="22 14"/>
  <circle cx="256" cy="256" r="166" fill="none" stroke="#22d3ee" stroke-opacity=".75" stroke-width="8" stroke-dasharray="200 61" transform="rotate(-50 256 256)"/>
  <circle cx="256" cy="256" r="136" fill="none" stroke="#22d3ee" stroke-opacity=".5" stroke-width="4" stroke-dasharray="640 214"/>
  <circle cx="256" cy="256" r="100" fill="#22d3ee" opacity=".55" filter="url(#brillo)"/>
  <circle cx="256" cy="256" r="100" fill="url(#nucleo)"/>
</svg>
