# =====================================================================
# J.A.R.V.I.S. · Pruebas y despliegue del backend (Supabase)
# Autor: Maldonado Jorge Matias
#
# 1) Pruebas: seudonimización, bucle del agente, validación, adaptador.
# 2) Despliegue (solo en main): migraciones + Edge Function.
# 3) Verificación: con la clave pública nadie puede leer nada.
#
# Entorno "produccion" (Settings → Environments → produccion):
#   Secret   SUPABASE_ACCESS_TOKEN  token de Supabase con permisos MÍNIMOS:
#                                   edge_functions_read + edge_functions_write
#   Secret   SUPABASE_DB_PASSWORD   contraseña de la base de datos
#   Secret   SUPABASE_PROJECT_REF   identificador del proyecto (acepta también la URL)
#   Variable SUPABASE_DB_CONEXION   cadena "Session pooler" copiada del botón Connect
#                                   de Supabase, CON el marcador [YOUR-…PASSWORD] tal cual
#                                   (la contraseña la pone el workflow desde el secret)
# Variables del repositorio: SUPABASE_URL, SUPABASE_CLAVE_PUBLICA (las mismas de la web)
#
# Mínimo privilegio: no se usa "supabase link" (exigiría que el token pueda
# leer las claves secretas del proyecto). Las migraciones van directo por
# la conexión a la base y el token solo puede publicar funciones.
#
# Los secrets de la FUNCIÓN (GEMINI_API_KEY, ALLOWED_EMAIL, ALLOWED_ORIGINS)
# se cargan directamente en Supabase, no acá: así la clave de Gemini
# vive en un solo lugar.
# =====================================================================
name: Backend

on:
  push:
    branches: [main]
    paths: ["supabase/**", "scripts/verificar-publicado.sh", ".github/workflows/supabase.yml"]
  pull_request:
    paths: ["supabase/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DENO: deno@2.9.6
  SUPABASE_CLI: supabase@2.122.1

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Buscar secretos
        run: bash scripts/buscar-secretos.sh
      - name: Pruebas (incluye "ningún nombre llega al modelo")
        run: npx --yes "$DENO" test --allow-env supabase/functions/_pruebas
      - name: Verificación de tipos
        run: npx --yes "$DENO" check supabase/functions/*/index.ts
      - name: Lint
        run: npx --yes "$DENO" lint supabase/functions

  desplegar:
    needs: pruebas
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Entorno "produccion": en Settings → Environments se puede exigir aprobación manual
    environment: produccion
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      DB_CONEXION: ${{ vars.SUPABASE_DB_CONEXION }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Revisar la configuración
        run: |
          # Acepta el ref solo ("abcdefghijklmnopqrst"), la URL del proyecto
          # (https://ref.supabase.co) o la del panel (supabase.com/dashboard/project/ref/…)
          ref=$(printf '%s' "$PROJECT_REF" | tr -d '[:space:]' | tr 'A-Z' 'a-z' \
            | sed -E 's#^.*/project/([a-z]{20}).*$#\1#; s#^https?://##; s#\.supabase\.co.*$##')
          if [[ ! "$ref" =~ ^[a-z]{20}$ ]]; then
            echo "::error::El secret SUPABASE_PROJECT_REF no es válido. Debe ser el identificador del proyecto: 20 letras minúsculas (las que aparecen en https://XXXXXXXXXXXXXXXXXXXX.supabase.co). Tiene ${#ref} caracteres."
            exit 1
          fi
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo "::error::Falta el secret SUPABASE_ACCESS_TOKEN en el entorno produccion."; exit 1; }
          [[ -n "$SUPABASE_DB_PASSWORD" ]] || { echo "::error::Falta el secret SUPABASE_DB_PASSWORD en el entorno produccion."; exit 1; }
          echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"

          # Cadena de conexión: tiene que ser la del "Session pooler" (funciona por IPv4,
          # que es lo que tienen los servidores de GitHub) y traer el marcador de contraseña
          con=$(printf '%s' "$DB_CONEXION" | tr -d '[:space:]')
          [[ -n "$con" ]] || { echo "::error::Falta la variable SUPABASE_DB_CONEXION en el entorno produccion (Supabase → botón Connect → Session pooler)."; exit 1; }
          # Supabase usa marcadores como [YOUR-PASSWORD] o [YOUR-DATABASE-PASSWORD]
          if [[ "$con" =~ (\[YOUR[-_A-Z]*PASSWORD\]) ]]; then
            marcador="${BASH_REMATCH[1]}"
          else
            echo "::error::SUPABASE_DB_CONEXION debe conservar el marcador de contraseña tal cual (por ejemplo [YOUR-PASSWORD]). Si pegó la contraseña ahí, bórrela de la variable y cámbiela en Supabase: las variables no son secretas."
            exit 1
          fi
          [[ "$con" == *"pooler.supabase.com"* ]] || { echo "::error::SUPABASE_DB_CONEXION tiene que ser la del 'Session pooler' (host …pooler.supabase.com)."; exit 1; }
          [[ "$con" == *"postgres.$ref"* ]] || { echo "::error::SUPABASE_DB_CONEXION no corresponde al proyecto de SUPABASE_PROJECT_REF."; exit 1; }
          # La contraseña se codifica para URL (puede tener símbolos) y se oculta de los registros
          clave=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$SUPABASE_DB_PASSWORD")
          url="${con/"$marcador"/$clave}"
          echo "::add-mask::$clave"
          echo "::add-mask::$url"
          echo "DB_URL=$url" >> "$GITHUB_ENV"
          echo "✓ Configuración completa (proyecto ${ref:0:4}…)"

      - name: Aplicar migraciones
        run: npx --yes "$SUPABASE_CLI" db push --db-url "$DB_URL" --yes

      - name: Publicar las Edge Functions
        run: |
          for f in jarvis-chat jarvis-acciones jarvis-cron jarvis-telegram jarvis-google; do
            npx --yes "$SUPABASE_CLI" functions deploy "$f" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --yes
          done

      - name: Configurar el reloj (pg_cron → jarvis-cron)
        run: |
          command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "select public.configurar_reloj('https://${PROJECT_REF}.supabase.co')"
          echo "✓ Reloj configurado"

      - name: Verificar que nada sea público
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_CLAVE_PUBLICA: ${{ vars.SUPABASE_CLAVE_PUBLICA }}
        run: bash scripts/verificar-publicado.sh
