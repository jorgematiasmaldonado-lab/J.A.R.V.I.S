# =====================================================================
# J.A.R.V.I.S. · Chequeo de secretos en cada push y pull request
# Autor: Maldonado Jorge Matias
# =====================================================================
name: Secretos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: bash scripts/buscar-secretos.sh
